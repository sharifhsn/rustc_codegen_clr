---
name: Release

on:
  push:
    tags: ['rust-dotnet-v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Bundle ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x64
            runner: ubuntu-22.04
          - host: macos-arm64
            runner: macos-15
          - host: windows-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      DOTNET_VERSION: '10'
    steps:
      - name: Check out release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Verify annotated signed release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash feasibility/verify_release_tag.sh
      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#rust-dotnet-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_manifests=(
            Cargo.toml
            tools/cargo-dotnet/Cargo.toml
            crates/rust-dotnet-assets/Cargo.toml
            crates/rust-dotnet-bindgen/Cargo.toml
            crates/rust-dotnet-sdk-core/Cargo.toml
            crates/rust-dotnet-pinvoke/Cargo.toml
            crates/rust-dotnet-native-contract-macros/Cargo.toml
          )
          for manifest in "${release_manifests[@]}"; do
            manifest_version="$(awk -F '"' '/^version = / { print $2; exit }' "$manifest")"
            [[ "$manifest_version" == "$version" ]] || {
              echo "$manifest version $manifest_version does not match tag $version" >&2
              exit 1
            }
          done
          grep -Fq "RUST_DOTNET_VERSION:-$version" install.sh
          grep -Fq "else { \"$version\" }" install.ps1
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Build compiler and installer
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            source_tree_sha256="$(git archive --format=tar HEAD | sha256sum | awk '{print $1}')"
          else
            source_tree_sha256="$(git archive --format=tar HEAD | shasum -a 256 | awk '{print $1}')"
          fi
          export CARGO_DOTNET_BUILD_ID="source-sha256:$source_tree_sha256"
          cargo build --release --workspace --frozen
          cargo +stable build --release --frozen --manifest-path tools/cargo-dotnet/Cargo.toml
      - name: Test SDK filesystem capabilities on Windows
        if: matrix.host == 'windows-x64'
        run: cargo test -p rust-dotnet-sdk-core --frozen
      - name: Run host-native P/Invoke acceptances
        shell: bash
        run: |
          bash feasibility/pinvoke_acceptance.sh
          bash feasibility/pinvoke_async_callback_acceptance.sh
          bash feasibility/pinvoke_safe_rust_acceptance.sh
      - name: Stage, build, and install-test SDK bundle
        shell: bash
        env:
          RCL_RELEASE_HOST: ${{ matrix.host }}
          RCL_RELEASE_VERSION: ${{ github.ref_name }}
          RCL_RELEASE_WORK_DIR: ${{ runner.temp }}/rust-dotnet-release
        run: |
          set -euo pipefail
          RCL_RELEASE_VERSION="${RCL_RELEASE_VERSION#rust-dotnet-v}"
          export RCL_RELEASE_VERSION
          bash feasibility/release_bundle.sh
      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.host }}
          if-no-files-found: error
          path: ${{ runner.temp }}/rust-dotnet-release/release-assets/*

  publish:
    name: Publish GitHub release
    needs: bundle
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Re-verify annotated signed release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash feasibility/verify_release_tag.sh
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Add installers
        run: cp install.sh install.ps1 release-assets/
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#rust-dotnet-v}"
          notes="docs/RELEASE_NOTES_${version}.md"
          test -f "$notes" || {
            echo "missing version-specific release notes: $notes" >&2
            exit 1
          }
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "rust-dotnet $version" \
            --notes-file "$notes" \
            --prerelease \
            --verify-tag
