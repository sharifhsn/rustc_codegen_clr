# Standalone crate (empty [workspace] keeps it out of the repo's workspace, since it
# lives inside the repo tree).
[workspace]

[package]
name = "kitchen_sink"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "kitchen_sink"
path = "src/main.rs"

# This fixture intentionally uses explicit wrapping_*/checked_* operations, so its differential
# oracle does not depend on a profile's implicit overflow policy. The separate
# cargo_tests/panic_msgs acceptance forces overflow-checks=true through build-std in both profiles.
